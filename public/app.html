<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudio</title>
<style>
  :root {
    --side:#0b1220; --side-hover:#16213a; --side-active:#1d3a6b;
    --side-line:#1b2740; --side-ink:#e6edf7; --side-dim:#8798b4;
    --accent:#3b82f6; --line:#e2e8f0; --bg:#f1f5f9; --ink:#0f172a;
    --danger:#f87171;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body { font:14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  button { font:inherit; cursor:pointer; }
  svg { display:block; }

  aside {
    position:fixed; top:0; left:0; bottom:0; width:276px; z-index:2;
    background:var(--side); color:var(--side-ink); display:flex; flex-direction:column;
    border-right:1px solid #060c17;
  }
  .head { padding:16px 16px 12px; }
  .back {
    display:inline-flex; align-items:center; gap:6px; color:var(--side-dim);
    text-decoration:none; font-size:13px; margin-bottom:14px;
  }
  .back:hover { color:#fff; }
  .apptitle { display:flex; align-items:center; gap:11px; }
  .apptitle .icon { width:32px; height:32px; border-radius:9px; display:grid; place-items:center; color:#fff; flex:0 0 auto; }
  .apptitle b { font-size:15.5px; font-weight:640; letter-spacing:-.01em; display:block; }
  .apptitle small { color:var(--side-dim); font-size:12.5px; }

  .tools { display:flex; gap:8px; padding:0 14px 12px; }
  .btn-primary {
    flex:1; padding:9px 10px; font-weight:600; font-size:13px; color:#fff;
    background:var(--accent); border:1px solid #2f6fd0; border-radius:8px;
    display:flex; align-items:center; justify-content:center; gap:7px;
  }
  .btn-primary:hover { background:#2f74e0; }
  .btn-icon {
    width:38px; flex:0 0 38px; display:grid; place-items:center; color:var(--side-dim);
    background:#14203a; border:1px solid var(--side-line); border-radius:8px;
  }
  .btn-icon:hover { background:var(--side-hover); color:var(--side-ink); }

  .search { padding:0 14px 12px; position:relative; }
  .search input {
    width:100%; padding:8px 10px 8px 32px; font:inherit; font-size:13px;
    color:var(--side-ink); background:#0f1930; border:1px solid var(--side-line);
    border-radius:8px; outline:none;
  }
  .search input::placeholder { color:#5f708f; }
  .search input:focus { border-color:var(--accent); background:#121e39; }
  .search svg { position:absolute; left:23px; top:9px; color:#5f708f; pointer-events:none; }

  .tree { flex:1; overflow-y:auto; padding:2px 8px 16px; }
  .tree::-webkit-scrollbar { width:9px; }
  .tree::-webkit-scrollbar-thumb { background:#1f2c47; border-radius:9px; border:2px solid var(--side); }

  .row { position:relative; display:flex; align-items:center; gap:6px; padding:6px 8px; border-radius:7px; cursor:pointer; user-select:none; }
  .row:hover { background:var(--side-hover); }
  .row.active { background:var(--side-active); }
  .row.active::before { content:''; position:absolute; left:0; top:7px; bottom:7px; width:2.5px; border-radius:0 3px 3px 0; background:var(--accent); }
  .row.drag-over { background:#17395f; box-shadow:inset 0 0 0 1.5px var(--accent); }
  .row.dragging { opacity:.4; }
  .row .twisty { width:16px; height:16px; flex:0 0 16px; display:grid; place-items:center; color:var(--side-dim); transition:transform .16s; }
  .twisty.open { transform:rotate(90deg); }
  .row .icon { width:17px; height:17px; flex:0 0 17px; color:#7aa7f0; }
  .row.doc .icon { color:#5f7a9e; }
  .row .label { flex:1; min-width:0; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row.folder .label { font-weight:500; }
  .row .acts { display:flex; gap:1px; opacity:0; transition:opacity .12s; }
  .row:hover .acts, .row.active .acts { opacity:1; }
  .row .acts button { width:22px; height:22px; display:grid; place-items:center; padding:0; background:transparent; border:0; border-radius:5px; color:var(--side-dim); }
  .row .acts button:hover { background:#26355a; color:#fff; }
  .row .acts button.del:hover { background:#4a1d1d; color:var(--danger); }
  .rename-input { flex:1; min-width:0; font:inherit; font-size:13.5px; background:#0f1930; color:#fff; border:1px solid var(--accent); border-radius:5px; padding:1px 5px; outline:none; }
  .crumb { font-size:11.5px; color:var(--side-dim); padding-left:22px; }
  .empty { padding:26px 16px; text-align:center; color:var(--side-dim); font-size:13px; }

  .foot { padding:10px 16px; border-top:1px solid var(--side-line); display:flex; justify-content:space-between; }
  .foot span { color:var(--side-dim); font-size:13px; }
  .foot button { background:transparent; border:0; color:var(--side-dim); font-size:13px; padding:3px 6px; border-radius:5px; }
  .foot button:hover { color:#fff; background:var(--side-hover); }

  main { position:fixed; top:0; left:276px; right:0; bottom:0; z-index:1; display:flex; flex-direction:column; background:var(--bg); }
  .top { height:48px; flex:0 0 auto; background:#fff; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:14px; padding:0 16px; }
  .top .title { font-weight:600; font-size:14px; }
  .top .status { color:#64748b; font-size:12.5px; }
  .spacer { flex:1; }
  .btn { padding:6px 12px; font-size:13px; border:1px solid var(--line); background:#fff; border-radius:7px; }
  .btn:hover { background:#f8fafc; }
  iframe { flex:1 1 0; min-height:0; width:100%; height:100%; border:0; display:block; background:#f3f3f3; }
</style>
</head>
<body>

<aside>
  <div class="head">
    <a class="back" href="/">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Todas las aplicaciones
    </a>
    <div class="apptitle">
      <span class="icon" id="appIcon"></span>
      <span><b id="appLabel">…</b><small id="appTag"></small></span>
    </div>
  </div>

  <div class="tools">
    <button class="btn-primary" id="newdoc">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      Documento
    </button>
    <button class="btn-icon" id="newfolder" title="Nueva carpeta">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
    </button>
  </div>

  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" placeholder="Buscar archivos…" autocomplete="off" spellcheck="false">
  </div>

  <div class="tree" id="tree"></div>

  <div class="foot"><span id="user">&nbsp;</span><button id="logout">Salir</button></div>
</aside>

<main>
  <div class="top">
    <span class="title" id="title">—</span>
    <span class="status" id="status">Cargando la aplicacion…</span>
    <span class="spacer"></span>
    <button class="btn" id="download">Descargar</button>
  </div>
  <iframe id="frame" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
</main>

<script>
const $ = (id) => document.getElementById(id);
const frame = $('frame');

const appId = location.pathname.split('/').filter(Boolean).pop();
let APP = null;
let folders = [], docs = [], current = null, dirty = false, query = '', renaming = null;
const expanded = new Set();

const say = (m) => { $('status').textContent = m; };
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

const ICON = {
  chevron:'<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  folder:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  folderOpen:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v1"/><path d="M3 10h18l-2 8a2 2 0 0 1-2 1.5H5A2 2 0 0 1 3 18z"/></svg>',
  file:'<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  pencil:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
  trash:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
  plus:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
};
const APPICONS = {
  gridcraft:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M3 15h18"/></svg>',
  wordcraft:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M8 13h8M8 17h5"/></svg>',
  pdfcraft:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
  photocraft:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="m21 16-5-5L5 20"/></svg>',
  vectorcraft:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19 7 14l9-9 5 5z"/><path d="M7 14H4a1 1 0 0 1-1-1v-2"/></svg>',
};

async function api(method, url, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(url, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `Error ${res.status}`);
  return data;
}

async function loadAll() {
  const [f, d] = await Promise.all([api('GET', '/api/folders'), api('GET', `/api/docs?app=${encodeURIComponent(appId)}`)]);
  folders = f.folders || [];
  docs = d.docs || [];
}

const kidsOf = (pid) => ({
  folders: folders.filter((f) => (f.parentId || null) === pid).sort((a, b) => a.name.localeCompare(b.name, 'es')),
  docs: docs.filter((d) => (d.folderId || null) === pid).sort((a, b) => a.name.localeCompare(b.name, 'es')),
});

function breadcrumb(id) {
  const out = []; let cur = id; const seen = new Set();
  while (cur && !seen.has(cur)) { seen.add(cur); const f = folders.find((x) => x.id === cur); if (!f) break; out.unshift(f.name); cur = f.parentId; }
  return out.join(' / ');
}

function renderTree() {
  const box = $('tree');
  box.innerHTML = '';
  const q = query.trim().toLowerCase();

  if (q) {
    const hits = docs.filter((d) => d.name.toLowerCase().includes(q));
    if (!hits.length) { box.innerHTML = `<div class="empty">Nada coincide con “${esc(query)}”</div>`; return; }
    for (const h of hits) {
      box.appendChild(rowEl('doc', h.id, h.name, 0));
      if (h.folderId) { const c = document.createElement('div'); c.className = 'crumb'; c.textContent = breadcrumb(h.folderId); box.appendChild(c); }
    }
    return;
  }

  const build = (pid, depth) => {
    const { folders: fs, docs: ds } = kidsOf(pid);
    if (!fs.length && !ds.length && depth === 0) { box.innerHTML = '<div class="empty">Aun no hay nada.<br>Crea tu primer documento.</div>'; return; }
    for (const f of fs) { box.appendChild(rowEl('folder', f.id, f.name, depth)); if (expanded.has(f.id)) build(f.id, depth + 1); }
    for (const d of ds) box.appendChild(rowEl('doc', d.id, d.name, depth));
  };
  build(null, 0);
}

function rowEl(kind, id, name, depth) {
  const row = document.createElement('div');
  row.className = `row ${kind}` + (kind === 'doc' && current && current.id === id ? ' active' : '');
  row.style.paddingLeft = (8 + depth * 15) + 'px';
  row.dataset.id = id;

  if (depth > 0) {
    const rail = document.createElement('span');
    rail.style.cssText = `position:absolute;left:${4 + depth * 15}px;top:0;bottom:0;width:1px;background:var(--side-line)`;
    row.appendChild(rail);
  }
  if (kind === 'folder') {
    const t = document.createElement('span');
    t.className = 'twisty' + (expanded.has(id) ? ' open' : '');
    t.innerHTML = ICON.chevron; row.appendChild(t);
    const ic = document.createElement('span'); ic.innerHTML = expanded.has(id) ? ICON.folderOpen : ICON.folder; row.appendChild(ic);
  } else {
    const sp = document.createElement('span'); sp.className = 'twisty'; row.appendChild(sp);
    const ic = document.createElement('span'); ic.innerHTML = ICON.file; row.appendChild(ic);
  }

  if (renaming === id) {
    const input = document.createElement('input');
    input.className = 'rename-input'; input.value = name; row.appendChild(input);
    input.focus(); input.select();
    const commit = async () => {
      const v = input.value.trim(); renaming = null;
      if (v && v !== name) {
        try { kind === 'folder' ? await api('PATCH', `/api/folders/${id}`, { name: v }) : await api('POST', `/api/docs/${id}/rename`, { name: v }); }
        catch (e) { say(e.message); }
      }
      await loadAll(); renderTree();
    };
    input.addEventListener('blur', commit, { once: true });
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { renaming = null; renderTree(); } });
  } else {
    const label = document.createElement('span'); label.className = 'label'; label.textContent = name; row.appendChild(label);
  }

  const acts = document.createElement('span');
  acts.className = 'acts';
  acts.innerHTML = `<button data-act="rename" title="Renombrar">${ICON.pencil}</button><button data-act="del" class="del" title="Eliminar">${ICON.trash}</button>${kind === 'folder' ? `<button data-act="sub" title="Nueva subcarpeta">${ICON.plus}</button>` : ''}`;
  row.appendChild(acts);
  acts.addEventListener('click', async (e) => {
    e.stopPropagation();
    const act = e.target.closest('button')?.dataset.act;
    if (act === 'rename') { renaming = id; renderTree(); }
    else if (act === 'sub') await createFolder(id);
    else if (act === 'del') {
      if (!confirm(kind === 'folder' ? `¿Eliminar la carpeta "${name}"?` : `¿Eliminar "${name}"?`)) return;
      try {
        await api('DELETE', kind === 'folder' ? `/api/folders/${id}` : `/api/docs/${id}`);
        if (kind === 'doc' && current && current.id === id) { current = null; say('Documento eliminado'); }
        await loadAll(); renderTree();
      } catch (e) { say(e.message); }
    }
  });

  row.addEventListener('click', () => {
    if (renaming) return;
    if (kind === 'folder') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); renderTree(); }
    else openDoc(id);
  });

  row.draggable = true;
  row.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', JSON.stringify({ kind, id })); e.dataTransfer.effectAllowed = 'move'; row.classList.add('dragging'); });
  row.addEventListener('dragend', () => row.classList.remove('dragging'));
  if (kind === 'folder') {
    row.addEventListener('dragover', (e) => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', async (e) => {
      e.preventDefault(); e.stopPropagation(); row.classList.remove('drag-over');
      let m; try { m = JSON.parse(e.dataTransfer.getData('text/plain')); } catch { return; }
      if (m.kind === kind && m.id === id) return;
      try {
        if (m.kind === 'doc') await api('POST', `/api/docs/${m.id}/move`, { folderId: id });
        else await api('POST', `/api/folders/${m.id}/move`, { parentId: id });
        expanded.add(id); await loadAll(); renderTree();
      } catch (err) { say(err.message); }
    });
  }
  return row;
}

async function createFolder(parentId = null) {
  const name = prompt('Nombre de la carpeta', 'Documentos');
  if (!name || !name.trim()) return;
  try { await api('POST', '/api/folders', { name: name.trim(), parentId }); if (parentId) expanded.add(parentId); await loadAll(); renderTree(); }
  catch (e) { say(e.message); }
}

let lastFolder = null;
$('tree').addEventListener('click', (e) => {
  const row = e.target.closest('.row.folder');
  if (row && !e.target.closest('.acts')) lastFolder = row.dataset.id;
});

$('newdoc').addEventListener('click', async () => {
  const name = prompt('Nombre del documento', `Documento.${APP.file}`);
  if (!name || !name.trim()) return;
  try {
    const { doc } = await api('POST', '/api/docs', { name: name.trim(), folderId: lastFolder, app: appId });
    if (lastFolder) expanded.add(lastFolder);
    await loadAll(); renderTree(); openDoc(doc.id);
  } catch (e) { say(e.message); }
});

$('newfolder').addEventListener('click', () => createFolder(null));
$('download').addEventListener('click', async () => {
  if (!current) return say('No hay documento abierto');
  const res = await fetch(`/api/docs/${current.id}/download`);
  if (!res.ok) return say('No se pudo descargar');
  const url = URL.createObjectURL(await res.blob());
  const a = document.createElement('a'); a.href = url; a.download = current.name; a.click(); URL.revokeObjectURL(url);
  say('Descargando…');
});
$('logout').addEventListener('click', async () => {
  if (dirty && !confirm('Tienes cambios sin guardar. ¿Salir de todos modos?')) return;
  await fetch('/api/logout', { method: 'POST' }); location.href = '/';
});

let qt;
$('q').addEventListener('input', (e) => { clearTimeout(qt); const v = e.target.value; qt = setTimeout(() => { query = v; renderTree(); }, 120); });

// ---- Abrir documento en la app ---------------------------------------------
async function openDoc(id, { silent = false } = {}) {
  const doc = docs.find((d) => d.id === id);
  if (!doc) return;
  if (dirty && !silent && !confirm('El documento actual tiene cambios sin guardar. ¿Abrir otro?')) return;
  current = doc;
  $('title').textContent = doc.name;
  renderTree();
  say('Abriendo…');

  const res = await fetch(`/api/docs/${doc.id}`);
  if (!res.ok) return say('No se pudo abrir el documento');
  const bytes = await res.arrayBuffer();

  if (APP.bridge === 'native') {
    frame.contentWindow.postMessage({ type: 'gridcraft:open', name: doc.name, bytes }, location.origin);
  } else {
    frame.contentWindow.postMessage({ suite: 'open', name: doc.name, bytes }, location.origin);
  }
  dirty = false;
  say(doc.name);
}

async function upload(name, bytes) {
  if (!current) {
    // Primera escritura: la app creo el archivo, no existed antes.
    const { doc } = await api('POST', '/api/docs', { name, folderId: lastFolder, app: appId });
    current = doc; $('title').textContent = name;
    await loadAll(); renderTree();
  }
  await fetch(`/api/docs/${current.id}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/octet-stream', 'X-Doc-Name': encodeURIComponent(name || '') },
    body: bytes,
  });
  dirty = false;
  say(`Guardado ${name} (${bytes.byteLength.toLocaleString('es')} bytes)`);
  await loadAll(); renderTree();
}

// eframe en WASM mide el canvas al arrancar y no siempre reacciona a que el
// contenedor cambie. Sin esto, en ventanas grandes se ve pequeno.
function syncCanvas() { try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch (_) {} }
new ResizeObserver(syncCanvas).observe(frame);
window.addEventListener('resize', syncCanvas);

// ---- Puente ----------------------------------------------------------------
window.addEventListener('message', async (e) => {
  if (e.origin !== location.origin || e.source !== frame.contentWindow) return;
  const d = e.data || {};

  if (d.type === 'gridcraft:ready' || d.suite === 'ready') {
    syncCanvas();
    await loadAll(); renderTree();
    if (docs.length) await openDoc(docs[0].id, { silent: true });
    else say('Crea tu primer documento para empezar');
  }
  if (d.type === 'gridcraft:save' || d.suite === 'saved') {
    try { await upload(d.name, d.bytes); } catch (err) { say(err.message); }
  }
  if (d.type === 'gridcraft:dirty') {
    dirty = !!d.dirty;
    window.onbeforeunload = dirty ? () => 'Tienes cambios sin guardar' : null;
    say(dirty ? '● Cambios sin guardar' : '✓ Guardado');
  }
  if (d.type === 'gridcraft:failed' || d.suite === 'error') say(`Error: ${d.error}`);
});

// ---- Arranque ---------------------------------------------------------------
(async function boot() {
  const me = await fetch('/api/me').then((r) => r.json()).catch(() => ({}));
  $('user').textContent = me.user || '';
  try {
    const { apps } = await api('GET', '/api/apps');
    APP = apps.find((a) => a.id === appId);
    if (!APP) throw new Error('App desconocida');
    $('appLabel').textContent = APP.label;
    $('appTag').textContent = APP.tagline;
    $('appIcon').innerHTML = APPICONS[appId] || '';
    $('appIcon').style.background = `linear-gradient(140deg,${APP.colors[0]},${APP.colors[1]})`;
    document.title = `${APP.label} — Estudio`;
  } catch (e) {
    say(e.message); return;
  }
  await loadAll(); renderTree();

  frame.addEventListener('load', () => { syncCanvas(); setTimeout(syncCanvas, 150); setTimeout(syncCanvas, 900); });
  const qs = APP.bridge === 'native' ? `?host=parent&author=${encodeURIComponent(me.user || '')}` : '';
  frame.src = `/apps/${appId}/${qs}`;
})();
</script>
</body>
</html>
